<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="StreamersTip - Social platform for streamers and content creators">
  <title>StreamersTip</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #764ba2;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-attachment: fixed;
      color: #ffffff;
    }
    .splash-container {
      text-align: center;
      padding: 2rem;
      z-index: 1;
    }
    .logo {
      font-size: 3rem;
      font-weight: bold;
      margin-bottom: 1rem;
      color: #ffffff;
    }
    .tagline {
      font-size: 1.2rem;
      opacity: 0.9;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo">StreamersTip</div>
    <div class="tagline">Social platform for streamers and content creators</div>
  </div>
</body>
</html>
