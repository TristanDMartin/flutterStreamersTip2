name: Dependency audit

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  outdated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Report outdated packages
        run: |
          flutter pub outdated
          echo "::notice::Review Dependabot PRs weekly; merge after flutter test + analyze."
