name: QA

on:
  workflow_dispatch:
    inputs:
      mobile_feed_e2e:
        description: "Run Android/iOS home feed playback E2E"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  pull_request:
  push:
    branches:
      - main
      - master
      - flutterStreamersTip2

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Linux desktop build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjson-glib-dev xvfb

      - name: Enable Linux desktop target
        run: flutter config --enable-linux-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        # Flutter 3.50 treats infos as fatal and deprecates
        # package:flutter/material.dart for the whole framework.
        run: flutter analyze --no-fatal-infos

      - name: Flutter unit tests
        run: flutter test

      - name: Flutter integration_test harness
        run: xvfb-run -a flutter test integration_test/qa_harness_test.dart -d linux

  cloud-functions-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci
        working-directory: cloud_functions

      - name: ESLint
        run: npm run lint
        working-directory: cloud_functions

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Firestore rules regression - likes
        run: npx firebase-tools emulators:exec --only firestore --project demo-likes-tests "npm --prefix cloud_functions run test:rules:likes"

      - name: Firestore rules regression - interactions and FCM tokens
        run: npx firebase-tools emulators:exec --only firestore --project demo-interactions-tests "npm --prefix cloud_functions run test:rules:interactions"

      - name: Firestore rules regression - users privacy (web contract)
        run: npx firebase-tools emulators:exec --only firestore --project demo-users-privacy "npm --prefix cloud_functions run test:rules:users-privacy"

  android-feed-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mobile_feed_e2e == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Block production Firebase
        run: |
          echo "android-feed-e2e BLOCKED" >> "$GITHUB_STEP_SUMMARY"
          echo "The app is compiled against Firebase project streamerstip-6cfdb." >> "$GITHUB_STEP_SUMMARY"
          echo "This job signs in and plays the live home feed. Playback can write view counters on real creator videos." >> "$GITHUB_STEP_SUMMARY"
          echo "There is no staging Auth, Firestore, Storage, Functions, or Mux worker in this build." >> "$GITHUB_STEP_SUMMARY"
          echo "android-feed-e2e BLOCKED: refusing to sign into production."
          exit 1

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Flutter pub get
        run: flutter pub get

      - name: Android home feed playback E2E
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FLUTTER_INTEGRATION_TEST_TARGET: integration_test/home_feed_playback_e2e_test.dart
          RUN_MOBILE_FEED_E2E: "true"
          QA_EMAIL_OR_USERNAME: ${{ secrets.QA_EMAIL_OR_USERNAME }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: ./scripts/run_flutter_integration_tests.sh

  ios-feed-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mobile_feed_e2e == 'true' }}
    runs-on: macos-15
    steps:
      - name: Block production Firebase
        run: |
          echo "ios-feed-e2e BLOCKED" >> "$GITHUB_STEP_SUMMARY"
          echo "The app is compiled against Firebase project streamerstip-6cfdb." >> "$GITHUB_STEP_SUMMARY"
          echo "This job signs in and plays the live home feed. Playback can write view counters on real creator videos." >> "$GITHUB_STEP_SUMMARY"
          echo "There is no staging Auth, Firestore, Storage, Functions, or Mux worker in this build." >> "$GITHUB_STEP_SUMMARY"
          echo "ios-feed-e2e BLOCKED: refusing to sign into production."
          exit 1

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Boot iOS simulator
        run: |
          xcrun simctl boot "iPhone 16" || xcrun simctl boot "iPhone 15" || true
          xcrun simctl bootstatus booted -b

      - name: Pre-build iOS simulator app (VM service discovery)
        run: flutter build ios --simulator --debug

      - name: iOS home feed playback E2E
        env:
          PREFER_INTEGRATION_DEVICE: ios
          IOS_PREINSTALL: "0"
          FLUTTER_INTEGRATION_TEST_TARGET: integration_test/home_feed_playback_e2e_test.dart
          RUN_MOBILE_FEED_E2E: "true"
          QA_EMAIL_OR_USERNAME: ${{ secrets.QA_EMAIL_OR_USERNAME }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        run: ./scripts/run_flutter_integration_tests.sh

  # Reports whether Playwright is configured. A success here means the
  # configuration was checked. It does not mean Playwright ran.
  web-e2e-config:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Classify Playwright configuration
        id: check
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: |
          if [ -n "$E2E_BASE_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "web-e2e configured. Playwright will run in the web-e2e job." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "web-e2e BLOCKED" >> "$GITHUB_STEP_SUMMARY"
            echo "E2E_BASE_URL is empty. Playwright did not run. This is not a pass." >> "$GITHUB_STEP_SUMMARY"
            echo "web-e2e BLOCKED: E2E_BASE_URL is not configured. Playwright did not run."
          fi

  web-e2e:
    needs: web-e2e-config
    if: needs.web-e2e-config.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright deps
        run: npm ci
        working-directory: tests/e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Run Playwright
        working-directory: tests/e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        run: npx playwright test --reporter=line --reporter=json

      - name: Require an executed pass
        working-directory: tests/e2e
        run: |
          node -e '
            const fs = require("fs");
            const stats = JSON.parse(fs.readFileSync("playwright-results.json", "utf8")).stats;
            const passed = stats && stats.expected ? stats.expected : 0;
            const failed = stats && stats.unexpected ? stats.unexpected : 0;
            const skipped = stats && stats.skipped ? stats.skipped : 0;
            console.log(`Playwright passed=${passed} failed=${failed} skipped=${skipped}`);
            if (failed > 0 || passed < 1) {
              console.error("Playwright did not record an executed pass.");
              process.exit(1);
            }
          '

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report

      - name: Upload Playwright test-results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: tests/e2e/test-results
