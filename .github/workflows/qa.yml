name: QA

on:
  workflow_dispatch:
    inputs:
      mobile_feed_e2e:
        description: "Run Android/iOS home feed playback E2E"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  pull_request:
  push:
    branches:
      - main
      - master
      - flutterStreamersTip2

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Linux desktop build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev

      - name: Enable Linux desktop target
        run: flutter config --enable-linux-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter unit tests
        run: flutter test

      - name: Flutter integration_test harness
        run: flutter test integration_test/qa_harness_test.dart -d linux

  cloud-functions-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci
        working-directory: cloud_functions

      - name: ESLint
        run: npm run lint
        working-directory: cloud_functions

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Firestore rules regression - likes
        run: npx firebase-tools emulators:exec --only firestore --project demo-likes-tests "npm --prefix cloud_functions run test:rules:likes"

      - name: Firestore rules regression - interactions and FCM tokens
        run: npx firebase-tools emulators:exec --only firestore --project demo-interactions-tests "npm --prefix cloud_functions run test:rules:interactions"

  android-feed-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mobile_feed_e2e == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Flutter pub get
        run: flutter pub get

      - name: Android home feed playback E2E
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FLUTTER_INTEGRATION_TEST_TARGET: integration_test/home_feed_playback_e2e_test.dart
          RUN_MOBILE_FEED_E2E: "true"
          QA_EMAIL_OR_USERNAME: ${{ secrets.QA_EMAIL_OR_USERNAME }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: ./scripts/run_flutter_integration_tests.sh

  ios-feed-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mobile_feed_e2e == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Boot iOS simulator
        run: |
          xcrun simctl boot "iPhone 16" || xcrun simctl boot "iPhone 15" || true
          xcrun simctl bootstatus booted -b

      - name: iOS home feed playback E2E
        env:
          PREFER_INTEGRATION_DEVICE: ios
          FLUTTER_INTEGRATION_TEST_TARGET: integration_test/home_feed_playback_e2e_test.dart
          RUN_MOBILE_FEED_E2E: "true"
          QA_EMAIL_OR_USERNAME: ${{ secrets.QA_EMAIL_OR_USERNAME }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        run: ./scripts/run_flutter_integration_tests.sh

  # Next.js only; skipped unless E2E_BASE_URL is configured (Flutter-only QA
  # does not need this job).
  web-e2e:
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip web e2e when no base URL is configured
        if: ${{ env.E2E_BASE_URL == '' }}
        run: echo "E2E_BASE_URL is not configured; skipping web e2e."

      - uses: actions/setup-node@v4
        if: ${{ env.E2E_BASE_URL != '' }}
        with:
          node-version: "22"

      - name: Install Playwright deps
        if: ${{ env.E2E_BASE_URL != '' }}
        run: npm ci
        working-directory: tests/e2e

      - name: Install Chromium
        if: ${{ env.E2E_BASE_URL != '' }}
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Run Playwright
        if: ${{ env.E2E_BASE_URL != '' }}
        working-directory: tests/e2e
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report

      - name: Upload Playwright test-results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: tests/e2e/test-results
