name: QA

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Linux desktop build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev

      - name: Enable Linux desktop target
        run: flutter config --enable-linux-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter unit tests
        run: flutter test

      - name: Flutter integration_test harness
        run: flutter test integration_test -d linux

  cloud-functions-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci
        working-directory: cloud_functions

      - name: ESLint
        run: npm run lint
        working-directory: cloud_functions

  # Next.js only; skipped unless E2E_BASE_URL is configured (Flutter-only QA
  # does not need this job).
  web-e2e:
    if: ${{ secrets.E2E_BASE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright deps
        run: npm ci
        working-directory: tests/e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Run Playwright
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        working-directory: tests/e2e
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report

      - name: Upload Playwright test-results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: tests/e2e/test-results
