name = "streamerstip-mux-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
MUX_API = "https://api.mux.com"
MUX_STREAM_BASE = "https://stream.mux.com"
FIRESTORE_BASE = "https://firestore.googleapis.com/v1/projects"

# Secrets (set via: wrangler secret put MUX_TOKEN_ID)
# MUX_TOKEN_ID
# MUX_TOKEN_SECRET
# MUX_WEBHOOK_SECRET
# FIREBASE_PROJECT_ID
# FIREBASE_SERVICE_ACCOUNT_JSON (minified JSON string of service account key)

# Deploy to workers.dev: https://streamerstip-mux-api.<account>.workers.dev
# For custom domain api.streamerstip.com, add after deploy:
#   wrangler deploy --route "api.streamerstip.com/*"
