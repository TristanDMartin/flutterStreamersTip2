name: streamers_tip
description: A social platform for streamers and content creators
publish_to: 'none'
version: 1.0.1+2026050301

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Firebase - Updated to latest versions
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  firebase_remote_config: ^6.0.1
  firebase_messaging: ^16.0.1
  cloud_functions: ^6.0.1

  # Google Sign In - Updated to support GoogleUtilities 8.0
  google_sign_in: 6.2.2
  
  # UI & Navigation
  go_router: ^17.1.0
  
  # Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  
  # Utilities
  permission_handler: ^12.0.1
  camera: ^0.11.2
  video_player: ^2.8.1
  video_thumbnail: ^0.5.6
  cached_network_image: ^3.3.0
  image_picker: ^1.0.4
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^2.4.9
  equatable: ^2.0.5
  flutter_svg: ^2.0.9
  url_launcher: ^6.2.5
  timezone: ^0.10.1
  
  # Video Processing
  path_provider: ^2.1.1
  path: ^1.8.3
  image: ^4.1.7
  
  # Push Notifications
  flutter_local_notifications: ^20.1.0
  
  # Contacts & Invites
  # contacts_service: ^0.6.3  # Has namespace issues, using custom implementation
  crypto: ^3.0.3
  
  # HTTP & Networking
  http: ^1.1.2
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  
  # Other
  intl: ^0.20.2
  uuid: ^4.2.1
  qr_flutter: ^4.1.0
  geolocator: ^14.0.2
  share_plus: ^12.0.0
  connectivity_plus: ^7.0.0
  mobile_scanner: ^7.0.1
  giphy_picker: ^3.0.2
  pasteboard: ^0.3.0
  csv: ^6.0.0
  
  # 2FA and Security
  local_auth: ^3.0.0
  flutter_secure_storage: ^10.0.0
  
  # Production Dependencies - Updated to latest versions
  firebase_analytics: ^12.0.1
  firebase_crashlytics: ^5.0.1
  flutter_cache_manager: ^3.3.1
  in_app_purchase: ^3.2.3
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.11.1
  freezed: ^3.2.4
  json_serializable: ^6.11.4
  
  # Icon Generation
  flutter_launcher_icons: ^0.14.4
  
  # Linting
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/share_icons/

# Flutter Launcher Icons Configuration
# Note: Not using adaptive icons to avoid circular mask
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/091225_ST_logo_white.PNG"
  min_sdk_android: 21
  remove_alpha_ios: true
