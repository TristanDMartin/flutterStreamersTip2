name: streamers_tip
description: A social platform for streamers and content creators
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.6.5
  firebase_remote_config: ^4.3.8
  firebase_messaging: ^14.7.10
  
  # Google Sign In
  google_sign_in: ^6.1.6
  
  # UI & Navigation
  go_router: ^12.1.3
  auto_route: ^7.8.4
  
  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # Utilities
  permission_handler: ^11.1.0
  camera: ^0.10.5+5
  video_player: ^2.8.1
  video_thumbnail: ^0.5.6
  cached_network_image: ^3.3.0
  image_picker: ^1.0.4
  flutter_hooks: ^0.20.3
  hooks_riverpod: ^2.4.9
  equatable: ^2.0.5
  
  # Video Processing
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # HTTP & Networking
  http: ^1.1.2
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Other
  intl: ^0.19.0
  uuid: ^4.2.1
  qr_flutter: ^4.1.0
  geolocator: ^10.1.0
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  crypto: ^3.0.3
  connectivity_plus: ^5.0.2
  mobile_scanner: ^5.0.0
  giphy_picker: ^3.0.2
  
  # Production Dependencies
  firebase_analytics: ^10.8.0
  firebase_crashlytics: ^3.4.9
  flutter_cache_manager: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  auto_route_generator: ^7.3.2
  hive_generator: ^2.0.1
  
  # Linting
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/
